services:
  wikijs-mcp:
    build:
      context: .
    container_name: wikijs-mcp
    restart: unless-stopped
    environment:
      TRANSPORT: http
      HTTP_HOST: 0.0.0.0
      HTTP_PORT: 3200
      MCP_PATH: ${MCP_PATH:-/mcp}
      WIKIJS_API_URL: ${WIKIJS_API_URL}
      WIKIJS_API_TOKEN: ${WIKIJS_API_TOKEN}
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN:-}
      MCP_ALLOWED_HOSTS: ${MCP_ALLOWED_HOSTS:-localhost,127.0.0.1}
      MCP_ALLOWED_ORIGINS: ${MCP_ALLOWED_ORIGINS:-}
    ports:
      - "3200:3200"
    networks:
      - proxied-network
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3200/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

networks:
  proxied-network:
    external: true
